[package]
name = "open-livekit"
version = "0.1.0"
edition = "2024"

[dependencies]
# ローカル開発機ではF:\RPoemを兄弟ディレクトリとしてpathで参照する。
# CI/他クローン環境ではgitソースに切り替える(実装が進んだ段階で移行)。
open-runo-federation = { path = "../RPoem/crates/open-runo-federation" }
# 技術選定1(README.md「技術選定の決定事項」参照): webrtc-rsを採用。
webrtc = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
bytes = "1.12.1"

# RUSTSEC-2026-0387(crypto-bigint 0.5)対応: webrtc-dtlsのECDHをp256/p384からringへ差し替えた版。
# 差分はvendor/webrtc-dtls/PATCHES.mdを参照(上流が追従したら外す)。
[patch.crates-io]
webrtc-dtls = { path = "vendor/webrtc-dtls" }
